version: '3.8'

services:
  # Gotenberg container - runs LibreOffice and Chromium for document conversion
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    ports:
      - "3001:3000"
    networks:
      - app-network
    environment:
      # Optional: Configure Gotenberg settings
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Next.js application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-app
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      # Point to Gotenberg via service name (Docker DNS resolution)
      GOTENBERG_URL: http://gotenberg:3000
      NODE_ENV: development
    depends_on:
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
